name: Production Deploy

on:
  pull_request:
    branches:
      - "production"
    types:
      - closed

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Deploy Convex functions
        run: bunx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}

      - name: Build app
        run: bun run build
        env:
          VITE_CONVEX_URL: https://grandiose-narwhal-704.convex.cloud
          VITE_CONVEX_SITE_URL: https://grandiose-narwhal-704.convex.site

      - name: Deploy to Cloudflare Workers
        run: bunx wrangler deploy --name nihongo-ninja
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
