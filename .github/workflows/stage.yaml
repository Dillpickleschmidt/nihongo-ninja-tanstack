name: Staging Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "convex/**"
      - "*.json"
      - "*.yaml"
      - "*.config.js"
      - "*.config.ts"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Deploy Convex functions
        run: bunx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_STAGING }}

      - name: Build app
        run: bun run build
        env:
          VITE_CONVEX_URL: https://canny-caterpillar-326.convex.cloud
          VITE_CONVEX_SITE_URL: https://canny-caterpillar-326.convex.site

      - name: Deploy to Cloudflare Workers
        run: bunx wrangler deploy --name nihongo-ninja-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create or Update PR to Production
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Deploy to Production" \
            --body "Automated PR to deploy changes to production. **Merge using 'Rebase and merge' to keep branches in sync.**" \
            --base production \
            --head main || true
